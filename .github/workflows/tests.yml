name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check theme-init.js
          node --check build-estimator.js
          node --check recipe-browser.js
          node --check farm-data.js
          node --check farm-browser.js
      - name: Run Node test suite
        run: node --test tests/*.test.js
      - name: Run release-readiness checks
        run: node --test tests/release-readiness.test.js
